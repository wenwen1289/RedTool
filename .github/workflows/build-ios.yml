name: Build iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**.swift"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          xcodebuild -project RedBookTool.xcodeproj \
            -scheme RedBookTool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RedBookTool.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/RedBookTool.xcarchive/Products/Applications/RedBookTool.app" build/Payload/
          cd build
          zip -r RedTool-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedTool-unsigned-ipa
          path: build/RedTool-unsigned.ipa
